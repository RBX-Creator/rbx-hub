<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS // COMMAND CENTER</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #060101;
            --panel-bg: rgba(20, 4, 4, 0.85);
            --border-red: #ff2200;
            --glow-red: rgba(255, 34, 0, 0.5);
            --text-main: #ff9988;
            --text-bright: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-red);
            background: var(--panel-bg);
            padding: 10px 15px;
            border-radius: 6px;
            box-shadow: 0 0 12px var(--glow-red);
        }

        h1 {
            color: var(--text-bright);
            font-size: 1rem;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .status {
            color: #00ff66;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* GLOBUS SECTION (CENTERPIECE) */
        .globe-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-red);
            border-radius: 6px;
            height: 260px;
            width: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(255, 0, 0, 0.15), 0 0 15px var(--glow-red);
            overflow: hidden;
        }

        #globe-canvas {
            width: 100% !important;
            height: 100% !important;
            touch-action: none;
        }

        /* GRID FÜR WIDGETS */
        .widgets-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-red);
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 0 8px var(--glow-red);
        }

        .panel-full {
            grid-column: span 2;
        }

        .panel h2 {
            font-size: 0.7rem;
            color: var(--text-bright);
            border-bottom: 1px solid rgba(255, 34, 0, 0.4);
            padding-bottom: 4px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-val {
            font-size: 1.8rem;
            color: var(--text-bright);
            font-weight: 900;
            text-shadow: 0 0 8px var(--border-red);
            margin: 4px 0;
        }

        .sub-text {
            font-size: 0.65rem;
            opacity: 0.7;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.75rem;
        }

        .news-item {
            border-bottom: 1px dashed rgba(255, 34, 0, 0.2);
            padding-bottom: 4px;
        }

        /* BUTTON */
        .btn-container {
            margin-top: auto;
            padding-top: 10px;
        }

        .start-btn {
            width: 100%;
            background: rgba(255, 34, 0, 0.25);
            border: 2px solid var(--border-red);
            color: var(--text-bright);
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 2px;
            border-radius: 6px;
            box-shadow: 0 0 20px var(--glow-red);
            cursor: pointer;
            text-align: center;
        }

        .start-btn:active {
            background: var(--border-red);
            color: #000;
        }

        /* DESKTOP OPTIMIERUNG */
        @media (min-width: 768px) {
            body {
                max-width: 1000px;
                margin: 0 auto;
                padding: 20px;
            }
            .widgets-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .globe-card {
                height: 380px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>JARVIS // COMMAND CENTER</h1>
        <div class="status">● ONLINE</div>
    </header>

    <!-- RUNDER GLOBUS IN DER MITTE -->
    <div class="globe-card" id="globe-box">
        <canvas id="globe-canvas"></canvas>
    </div>

    <!-- METRIKEN & KONTOSTAND -->
    <div class="widgets-grid">
        <div class="panel">
            <h2>FINANZEN</h2>
            <div class="sub-text">KONTOSTAND</div>
            <div class="balance-val">0,00 €</div>
            <div class="sub-text" style="color: #00ff66;">PIPELINE: +0,00 €</div>
        </div>

        <div class="panel">
            <h2>SYSTEM</h2>
            <div class="sub-text">CPU LOAD: <b style="color:#fff">12%</b></div>
            <div class="sub-text" style="margin-top: 4px;">RAM: <b style="color:#fff">2.4 / 16 GB</b></div>
            <div class="sub-text" style="margin-top: 4px;">LATENZ: <b style="color:#00ff66">14 ms</b></div>
        </div>

        <div class="panel panel-full">
            <h2>LIVE FEEDS // NEWS</h2>
            <div class="news-list">
                <div class="news-item"><b style="color:#fff">[12:00]</b> KI-System V1.0 online.</div>
                <div class="news-item"><b style="color:#fff">[11:45]</b> Sprachsteuerung bereit.</div>
            </div>
        </div>
    </div>

    <div class="btn-container">
        <button class="start-btn" onclick="triggerAI()">KI STARTEN</button>
    </div>

    <script>
        // GLOBUS SETUP (Echter runder 3D Globus)
        const box = document.getElementById('globe-box');
        const canvas = document.getElementById('globe-canvas');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, box.clientWidth / box.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

        function resize() {
            const w = box.clientWidth;
            const h = box.clientHeight;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);

        // Kugel (Gitter)
        const geometry = new THREE.SphereGeometry(1.8, 20, 20);
        const material = new THREE.MeshBasicMaterial({
            color: 0xff2200,
            wireframe: true,
            transparent: true,
            opacity: 0.75
        });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        camera.position.z = 5;

        // Touch & Maus Steuerung
        let isDragging = false;
        let prevX = 0, prevY = 0;

        function startDrag(x, y) {
            isDragging = true;
            prevX = x;
            prevY = y;
        }

        function moveDrag(x, y) {
            if (!isDragging) return;
            const deltaX = x - prevX;
            const deltaY = y - prevY;
            globe.rotation.y += deltaX * 0.008;
            globe.rotation.x += deltaY * 0.008;
            prevX = x;
            prevY = y;
        }

        function stopDrag() { isDragging = false; }

        box.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', stopDrag);

        box.addEventListener('touchstart', e => startDrag(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchmove', e => moveDrag(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchend', stopDrag);

        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging) globe.rotation.y += 0.004;
            renderer.render(scene, camera);
        }
        animate();

        function triggerAI() {
            alert("JARVIS online. System bereit, Master!");
        }
    </script>
</body>
</html>
