<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS // MARK-85 LIVE GLOBE</title>
    <!-- Globe.GL Script -->
    <script src="//unpkg.com/globe.gl"></script>
    <style>
        :root {
            --bg-color: #040201;
            --panel-bg: rgba(18, 8, 2, 0.92);
            --amber-main: #ff6600;
            --amber-bright: #ffaa00;
            --amber-glow: rgba(255, 102, 0, 0.6);
            --text-main: #ffcc99;
            --text-bright: #ffffff;
            --hud-glow: 0 0 15px rgba(255, 102, 0, 0.4), inset 0 0 10px rgba(255, 102, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Mono', 'Courier New', monospace;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#1f0a02 1px, transparent 1px);
            background-size: 25px 25px;
            color: var(--text-main);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-x: hidden;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255, 102, 0, 0.4); background: var(--panel-bg);
            padding: 10px 15px; border-radius: 4px; box-shadow: var(--hud-glow);
        }
        .user-greeting { color: var(--text-bright); font-size: 0.85rem; font-weight: 800; letter-spacing: 1px; }
        .status { color: var(--amber-bright); font-size: 0.7rem; font-weight: bold; }

        /* LIVE GLOBUS CONTAINER */
        .globe-card {
            background: rgba(6, 3, 1, 0.95); border: 1px solid var(--amber-main);
            border-radius: 4px; height: 360px; width: 100%; position: relative;
            box-shadow: var(--hud-glow); overflow: hidden;
        }
        #globe-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        .globe-target-info {
            position: absolute; top: 10px; left: 10px; font-size: 0.65rem;
            color: var(--amber-bright); background: rgba(0,0,0,0.85);
            padding: 6px 10px; border: 1px solid var(--amber-main); border-radius: 3px;
            letter-spacing: 1px; z-index: 10; pointer-events: none;
        }

        /* MODUS SWITCHER BUTTONS */
        .mode-selector {
            position: absolute; bottom: 10px; left: 10px; display: flex; gap: 6px; z-index: 10;
        }
        .mode-btn {
            background: rgba(18, 8, 2, 0.9); border: 1px solid var(--amber-main);
            color: var(--amber-bright); font-size: 0.6rem; padding: 6px 10px;
            border-radius: 3px; cursor: pointer; font-weight: bold; transition: all 0.2s;
        }
        .mode-btn:hover, .mode-btn.active {
            background: var(--amber-main); color: #000; box-shadow: 0 0 10px var(--amber-glow);
        }

        .voice-status {
            display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem;
            color: var(--amber-bright); padding: 10px 14px; background: rgba(255, 102, 0, 0.1);
            border: 1px solid var(--amber-main); border-radius: 4px; box-shadow: var(--hud-glow);
        }
        .response-text { color: var(--text-bright); font-size: 0.8rem; line-height: 1.4; margin-top: 2px; }
    </style>
</head>
<body>

    <header>
        <div class="user-greeting">HALLO, MASTER</div>
        <div class="status">LIVE SATELLITE LINK</div>
    </header>

    <div class="voice-status">
        <div style="font-weight: bold;">JARVIS KONTROLLE</div>
        <div class="response-text" id="jarvis-response">Wähle einen Modus oder nutze Sprachbefehle (z. B. "Berlin", "New York").</div>
    </div>

    <!-- ECHTER INTERAKTIVER GLOBUS -->
    <div class="globe-card">
        <div class="globe-target-info" id="globe-info">STATUS: LIVE ECHTRAUM-ANSICHT</div>
        <div id="globe-container"></div>
        
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setGlobeMode('standard')">STANDARD HUD</button>
            <button class="mode-btn" onclick="setGlobeMode('clouds')">WOLKEN / WETTER</button>
            <button class="mode-btn" onclick="setGlobeMode('night')">NACHT-LICHTER</button>
        </div>
    </div>

    <script>
        // Globus Initialisierung mit Globe.GL
        const container = document.getElementById('globe-container');
        
        const myGlobe = Globe()
            (container)
            // Nutzt NASA Blue Marble / Satelliten Texturen für den echten 1:1 Look
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundColor('rgba(0,0,0,0)');

        // Automatische sanfte Rotation einstellen
        myGlobe.controls().autoRotate = true;
        myGlobe.controls().autoRotateSpeed = 0.8;
        myGlobe.controls().enableZoom = true;

        // Koordinaten wichtiger Orte für den Sprung
        const LOCATIONS = {
            "berlin": { lat: 52.52, lng: 13.40, alt: 1.5, name: "Berlin" },
            "new york": { lat: 40.71, lng: -74.00, alt: 1.5, name: "New York" },
            "tokio": { lat: 35.67, lng: 139.65, alt: 1.5, name: "Tokio" },
            "europa": { lat: 50.0, lng: 10.0, alt: 2.5, name: "Europa" }
        };

        function focusLocation(key) {
            const loc = LOCATIONS[key];
            if (!loc) return;
            
            // Stoppt kurz die Rotation und springt fließend zum Punkt
            myGlobe.controls().autoRotate = false;
            myGlobe.pointOfView({ lat: loc.lat, lng: loc.lng, altitude: loc.alt }, 1500);
            
            document.getElementById('globe-info').textContent = `TARGET: ${loc.name.toUpperCase()} (${loc.lat}°, ${loc.lng}°)`;
            document.getElementById('jarvis-response').textContent = `Fokussiere Sektor: ${loc.name}.`;

            // Nach 8 Sekunden Rotation fortsetzen
            setTimeout(() => {
                myGlobe.controls().autoRotate = true;
            }, 8000);
        }

        // Wetter/Wolken oder Nachtmodus umschalten
        function setGlobeMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'standard') {
                myGlobe.globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
                document.getElementById('globe-info').textContent = "STATUS: STANDARD HUD";
            } else if (mode === 'clouds') {
                // Echte Wolken-Texturüberlagerung für den Live-Wetter-Look
                myGlobe.globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg');
                myGlobe.cloudsImageUrl('//unpkg.com/three-globe/example/img/fair-clouds.png');
                document.getElementById('globe-info').textContent = "STATUS: LIVE WETTER & WOLKEN";
            } else if (mode === 'night') {
                myGlobe.globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg');
                myGlobe.cloudsImageUrl(null);
                document.getElementById('globe-info').textContent = "STATUS: NACHT-SATELLITENANSICHT";
            }
        }

        // Einfache Spracherkennung (optional integriert)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.continuous = true;
            
            recognition.onresult = (event) => {
                const text = event.results[event.results.length - 1][0].transcript.toLowerCase();
                for (let key in LOCATIONS) {
                    if (text.includes(key)) {
                        focusLocation(key);
                    }
                }
            };
            try { recognition.start(); } catch(e) {}
        }
    </script>
</body>
</html>
