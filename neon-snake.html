<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Snake – Cyber Edition</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a12;
      color: #0ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 8px 0;
      background-image: 
        radial-gradient(ellipse at 20% 50%, rgba(0, 255, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(255, 0, 255, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, #0a0a12 0%, #050510 100%);
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #0ff, #f0f, #0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
      margin-bottom: 8px;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { filter: drop-shadow(0 0 5px #0ff); }
      to { filter: drop-shadow(0 0 15px #f0f); }
    }
    .subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    #game-container {
      position: relative;
      border: 3px solid #0ff;
      border-radius: 12px;
      box-shadow: 
        0 0 20px #0ff,
        0 0 40px rgba(0, 255, 255, 0.3),
        inset 0 0 30px rgba(0, 255, 255, 0.05);
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #050510;
    }
    #ui {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      margin-top: 18px;
      padding: 0 10px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    #score, #highscore {
      text-shadow: 0 0 10px currentColor;
    }
    #score { color: #0ff; }
    #highscore { color: #f0f; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 16, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      backdrop-filter: blur(4px);
      z-index: 10;
    }
    #overlay h2 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #0ff, #f0f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #overlay p {
      color: #aaa;
      margin-bottom: 25px;
      font-size: 1.1rem;
    }
    #start-btn, #restart-btn {
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      padding: 12px 36px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    }
    #start-btn:hover, #restart-btn:hover {
      background: #0ff;
      color: #050510;
      box-shadow: 0 0 30px #0ff;
      transform: scale(1.05);
    }
    .controls {
      margin-top: 25px;
      color: #555;
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.6;
    }
    .controls span {
      color: #0ff;
      font-weight: 600;
    }
    #mobile-controls {
      display: none;
      margin-top: 10px;
      gap: 12px;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 5px;
    }
    .dpad button {
      background: rgba(0, 255, 255, 0.1);
      border: 2px solid #0ff;
      color: #0ff;
      font-size: 1.3rem;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .dpad button:active {
      background: #0ff;
      color: #050510;
    }
    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 3; }
    .dpad .empty { visibility: hidden; }
    @media (max-width: 600px) {
      body {
        justify-content: flex-start;
        padding-top: 6px;
        overflow-y: auto;
      }
      h1 { 
        font-size: 1.4rem; 
        margin-bottom: 2px;
        letter-spacing: 2px;
      }
      .subtitle {
        font-size: 0.75rem;
        margin-bottom: 8px;
      }
      #game-container {
        width: min(92vw, 380px);
      }
      canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
      }
      #ui {
        margin-top: 8px;
        font-size: 0.95rem;
        max-width: min(92vw, 380px);
      }
      #mobile-controls { 
        display: flex; 
        justify-content: center;
        margin-top: 8px;
        margin-bottom: 12px;
      }
      .dpad {
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(3, 52px);
        gap: 4px;
      }
      .dpad button {
        font-size: 1.2rem;
      }
      .controls { display: none; }
      #overlay h2 {
        font-size: 1.8rem;
      }
      #overlay p {
        font-size: 0.95rem;
        margin-bottom: 16px;
      }
      #start-btn {
        padding: 10px 28px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <h1>Neon Snake</h1>
  <div class="subtitle">Cyber Edition · 2026</div>

  <div id="game-container">
    <canvas id="game" width="500" height="500"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">NEON SNAKE</h2>
      <p id="overlay-text">Steuere die leuchtende Schlange und friss die Energiekugeln!</p>
      <button id="start-btn">Spiel starten</button>
    </div>
  </div>

  <div id="ui">
    <div id="score">Punkte: 0</div>
    <div id="highscore">Rekord: 0</div>
  </div>

  <div class="controls">
    Steuerung: <span>Pfeiltasten</span> oder <span>WASD</span> · Pause: <span>P</span><br>
    Tippe / klicke zum Neustart nach Game Over
  </div>

  <div id="mobile-controls">
    <div class="dpad">
      <div class="empty"></div>
      <button class="up" data-dir="up">▲</button>
      <div class="empty"></div>
      <button class="left" data-dir="left">◀</button>
      <div class="empty"></div>
      <button class="right" data-dir="right">▶</button>
      <div class="empty"></div>
      <button class="down" data-dir="down">▼</button>
      <div class="empty"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayText = document.getElementById('overlay-text');
    const startBtn = document.getElementById('start-btn');
    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake, dir, nextDir, food, score, highscore, gameLoop, running, paused;

    highscore = parseInt(localStorage.getItem('neonSnakeHigh') || '0');
    highscoreEl.textContent = 'Rekord: ' + highscore;

    function initGame() {
      snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
      dir = {x: 1, y: 0};
      nextDir = {x: 1, y: 0};
      score = 0;
      scoreEl.textContent = 'Punkte: 0';
      placeFood();
      running = true;
      paused = false;
      overlay.style.display = 'none';
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);
    }

    function placeFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
        valid = !snake.some(s => s.x === food.x && s.y === food.y);
      }
    }

    function update() {
      if (!running || paused) return;

      dir = nextDir;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

      // Wandkollision → Game Over
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver();
        return;
      }

      // Selbstkollision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = 'Punkte: ' + score;
        if (score > highscore) {
          highscore = score;
          highscoreEl.textContent = 'Rekord: ' + highscore;
          localStorage.setItem('neonSnakeHigh', highscore);
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Hintergrund
      ctx.fillStyle = '#050510';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid (subtil)
      ctx.strokeStyle = 'rgba(0, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0);
        ctx.lineTo(i * GRID, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * GRID);
        ctx.lineTo(canvas.width, i * GRID);
        ctx.stroke();
      }

      // Food (leuchtende Energiekugel)
      const fx = food.x * GRID + GRID / 2;
      const fy = food.y * GRID + GRID / 2;
      const gradient = ctx.createRadialGradient(fx, fy, 2, fx, fy, 14);
      gradient.addColorStop(0, '#fff');
      gradient.addColorStop(0.4, '#f0f');
      gradient.addColorStop(1, 'rgba(255, 0, 255, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(fx, fy, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f0f';
      ctx.shadowColor = '#f0f';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(fx, fy, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((seg, i) => {
        const x = seg.x * GRID;
        const y = seg.y * GRID;
        const isHead = i === 0;

        // Glow
        ctx.shadowColor = isHead ? '#0ff' : '#0af';
        ctx.shadowBlur = isHead ? 20 : 10;

        // Körper
        const grad = ctx.createLinearGradient(x, y, x + GRID, y + GRID);
        if (isHead) {
          grad.addColorStop(0, '#0ff');
          grad.addColorStop(1, '#08f');
        } else {
          const t = 1 - (i / snake.length) * 0.6;
          grad.addColorStop(0, `rgba(0, ${Math.floor(200 * t)}, ${Math.floor(255 * t)}, 0.95)`);
          grad.addColorStop(1, `rgba(0, ${Math.floor(150 * t)}, ${Math.floor(220 * t)}, 0.8)`);
        }

        ctx.fillStyle = grad;
        ctx.beginPath();
        roundRect(ctx, x + 2, y + 2, GRID - 4, GRID - 4, isHead ? 8 : 5);
        ctx.fill();

        // Augen am Kopf
        if (isHead) {
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#fff';
          const eyeOffset = 5;
          if (dir.x === 1) { // rechts
            ctx.beginPath(); ctx.arc(x + 14, y + 7, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 14, y + 13, 2.5, 0, Math.PI*2); ctx.fill();
          } else if (dir.x === -1) { // links
            ctx.beginPath(); ctx.arc(x + 6, y + 7, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 6, y + 13, 2.5, 0, Math.PI*2); ctx.fill();
          } else if (dir.y === -1) { // oben
            ctx.beginPath(); ctx.arc(x + 7, y + 6, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 13, y + 6, 2.5, 0, Math.PI*2); ctx.fill();
          } else { // unten
            ctx.beginPath(); ctx.arc(x + 7, y + 14, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 13, y + 14, 2.5, 0, Math.PI*2); ctx.fill();
          }
        }
      });
      ctx.shadowBlur = 0;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function gameOver() {
      running = false;
      clearInterval(gameLoop);
      overlayTitle.textContent = 'GAME OVER';
      overlayText.textContent = `Punkte: ${score}  ·  Rekord: ${highscore}`;
      startBtn.textContent = 'Nochmal spielen';
      startBtn.style.display = 'inline-block';
      overlay.style.display = 'flex';
    }

    function setDirection(newDir) {
      // Verhindere 180°-Wende
      if (newDir.x === -dir.x && newDir.y === -dir.y) return;
      nextDir = newDir;
    }

    // Tastatur
    document.addEventListener('keydown', e => {
      if (!running && e.code !== 'Space' && e.key !== 'Enter') return;

      switch (e.key.toLowerCase()) {
        case 'arrowup': case 'w': setDirection({x: 0, y: -1}); e.preventDefault(); break;
        case 'arrowdown': case 's': setDirection({x: 0, y: 1}); e.preventDefault(); break;
        case 'arrowleft': case 'a': setDirection({x: -1, y: 0}); e.preventDefault(); break;
        case 'arrowright': case 'd': setDirection({x: 1, y: 0}); e.preventDefault(); break;
        case 'p': 
          if (running) {
            paused = !paused;
            if (paused) {
              overlayTitle.textContent = 'PAUSE';
              overlayText.textContent = 'Drücke P zum Fortsetzen';
              startBtn.style.display = 'none';
              overlay.style.display = 'flex';
            } else {
              overlay.style.display = 'none';
            }
          }
          break;
        case ' ': case 'enter':
          if (!running) initGame();
          break;
      }
    });

    // Mobile Buttons
    document.querySelectorAll('.dpad button').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = btn.dataset.dir;
        if (d === 'up') setDirection({x: 0, y: -1});
        if (d === 'down') setDirection({x: 0, y: 1});
        if (d === 'left') setDirection({x: -1, y: 0});
        if (d === 'right') setDirection({x: 1, y: 0});
      });
    });

    // Start / Restart
    startBtn.addEventListener('click', initGame);

    // Initial draw
    draw();
  </script>
</body>
</html>
